name: Prepare version release
run-name: Prepare version release · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Detect version change and dispatch tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test version and release automation
        run: python3 -B -m unittest discover -s tests -p 'test_*.py'
      - name: Create the version tag and start its release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/tag_version.py
